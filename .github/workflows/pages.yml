name: Build and deploy GalileoBrowser Pages

on:
  push:
    branches: [main]
  discussion:
    types: [created, edited, deleted, category_changed]
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: node scripts/build-pages.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GISCUS_ENABLED: ${{ vars.GISCUS_ENABLED }}

      - name: Validate clean routes and generated pages
        shell: bash
        run: |
          python -m http.server 4173 --directory dist > /tmp/galileo-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/', timeout=2)"; then
              break
            fi
            sleep 0.25
          done
          python tests/validate_site.py --base-url http://127.0.0.1:4173/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
